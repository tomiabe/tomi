<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,200..800&family=Zalando+Sans+Expanded:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; margin: 0; }
      body { background: #e8eddf; color: #242423; overflow: hidden; }
      .card { position: relative; display: grid; grid-template-columns: 1.45fr .9fr; width: 1200px; height: 630px; overflow: hidden; }
      .copy { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 72px 58px 58px 76px; }
      .wordmark { margin: 0; font: 700 27px/1 "Zalando Sans Expanded", Arial, sans-serif; letter-spacing: .02em; }
      .wordmark span { color: #d29e13; }
      h1 { max-width: 640px; margin: 0; font: 800 90px/.92 "Zalando Sans Expanded", Arial, sans-serif; letter-spacing: -.075em; }
      .intro { max-width: 530px; margin: 0; font: 400 34px/1.08 Newsreader, Georgia, serif; }
      .url { margin: 0; font: 600 17px/1 "Zalando Sans Expanded", Arial, sans-serif; letter-spacing: .06em; }
      .portrait { position: relative; border-left: 7px solid #f5cb5c; background: #333533; }
      .portrait img { width: 100%; height: 100%; object-fit: cover; object-position: 42% 32%; }
      .circle { position: absolute; top: 74px; right: 400px; width: 132px; height: 132px; border: 20px solid #f5cb5c; border-radius: 50%; }
      .caption { position: absolute; right: 34px; bottom: 34px; padding: 10px 13px; background: #242423; color: #e8eddf; font: 500 13px/1 "Zalando Sans Expanded", Arial, sans-serif; letter-spacing: .035em; }
    </style>
  </head>
  <body>
    <article class="card">
      <div class="circle" aria-hidden="true"></div>
      <div class="copy">
        <p class="wordmark">TOMI<span>.</span></p>
        <h1>TOMI ABE</h1>
        <p class="intro">A personal home for life, ideas, work, and notes from Lagos.</p>
        <p class="url">TOMIABE.COM</p>
      </div>
      <div class="portrait">
        <img src="../assets/images/tomi-abe-portrait.jpg" alt="" />
      </div>
      <p class="caption">HUMAN. BELIEVER. HUSBAND. BUILDER. STRATEGIST.</p>
    </article>
  </body>
</html>
