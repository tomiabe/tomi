<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eze | Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" />
    <link rel="stylesheet" href="styles.css?v=20260908-menu-and-scroll-refinements" />
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to inventory</a>
    <header class="site-header">
      <div class="main-header">
        <button class="brand" data-go-shop aria-label="Eze shop"><img src="assets/eze-logo.svg" alt="Eze" /></button>
        <label class="site-search"><i class="ph ph-magnifying-glass"></i><input id="site-search" type="search" placeholder="Search devices, brands, storage..." autocomplete="off" /></label>
        <button class="sell-button" data-sell-interest>Sell on Eze</button>
        <div class="account-actions">
          <button class="cart-action" id="cart-button"><i class="ph ph-shopping-cart"></i><span>Cart</span><b id="cart-count">0</b></button>
          <button class="notification-action" id="notification-button" aria-label="Notifications"><i class="ph ph-bell"></i><span class="account-notification-dot" id="account-notification" aria-label="A matched Buy Request needs payment" hidden></span></button>
          <div class="account-menu-wrap">
            <button class="account-action" id="account-button" aria-label="Open account menu" aria-expanded="false" aria-controls="account-menu"><i class="ph ph-user-circle"></i></button>
            <div class="account-menu" id="account-menu" role="menu" hidden>
              <div class="account-menu-profile"><strong>Buyer account</strong><span>Manage your marketplace activity</span></div>
              <button data-go-account role="menuitem"><i class="ph ph-user-circle"></i>Account overview</button>
              <button data-go-watchlist role="menuitem"><i class="ph ph-heart"></i>Watchlist <b id="watchlist-count" hidden>0</b></button>
              <button data-go-settings role="menuitem"><i class="ph ph-gear"></i>Company settings</button>
              <button data-sign-out role="menuitem"><i class="ph ph-sign-out"></i>Sign out</button>
            </div>
          </div>
          <button class="mobile-nav-toggle" type="button" data-mobile-nav-toggle aria-expanded="false" aria-controls="global-nav"><i class="ph ph-list" aria-hidden="true"></i><span>Menu</span></button>
        </div>
      </div>
      <div class="nav-row"><nav id="global-nav" aria-label="Primary"><button class="nav-shop" data-go-shop>Shop</button><button>How it works</button><button>Grading process</button><button>Return policy</button><button>Help</button><button>Contact us</button><button class="mobile-sell-link" data-sell-interest>Sell on Eze</button></nav></div>
    </header>
    <main id="content"></main>
    <aside class="cart-drawer" id="cart-drawer" aria-label="Shopping cart" aria-hidden="true"></aside>
    <div id="toast" role="status" aria-live="polite"></div>
    <script src="app.js?v=20260909-account-navigation"></script>
  </body>
</html>
