<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Translate documents with Translayte." />
    <title>Translayte | Document translation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" href="styles.css?v=2" />
  </head>
  <body>
    <div class="site-frame">
      <header class="site-header">
        <a class="brand" href="#start" data-action="new-translation" aria-label="Translayte home">
          <img class="brand-logo" src="assets/translayte-logo.svg" alt="" />
        </a>

        <nav class="main-nav" aria-label="Main navigation">
          <button type="button" class="nav-item" data-action="new-translation">Translate</button>
          <button type="button" class="nav-item" data-action="nav-services">Services <i class="ph ph-caret-down" aria-hidden="true"></i></button>
          <button type="button" class="nav-item" data-action="nav-pricing">Pricing</button>
          <button type="button" class="nav-item" data-action="nav-help">Help</button>
        </nav>

        <div class="header-actions" id="header-actions"></div>
      </header>

      <main id="app" class="app" tabindex="-1"></main>
    </div>

    <input id="document-input" class="visually-hidden" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.rtf" />
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script src="app.js?v=2"></script>
  </body>
</html>
