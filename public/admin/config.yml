backend:
  name: github
  repo: tomiabe/tomiabe
  branch: main
  base_url: https://www.tomiabe.com
  auth_endpoint: api/auth

# local_backend: true  # Disabled for production - only enable for local development

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "public/content/pages/home.json"
        label: "Home Page"
        name: "home"
        fields:
          - {label: "Settings", name: "settings", widget: "object", fields: [
              {label: "Site Title", name: "siteTitle", widget: "string"},
              {label: "Favicon", name: "favicon", widget: "image"},
              {label: "Accent Color", name: "accentColor", widget: "color"},
              {label: "Font Family", name: "fontFamily", widget: "select", options: ["sans", "serif", "mono", "manrope", "dmsans", "figtree", "ibmplex", "plusjakarta", "librefranklin", "publicsans", "geist", "schibsted", "monasans", "stacksans", "splinesans"]},
              {label: "Default Dark Mode Theme", name: "darkModeTheme", widget: "select", options: ["black", "grey", "navy", "maroon"]},
              {label: "Default Light Mode Theme", name: "lightModeTheme", widget: "select", options: ["white", "ash", "ivory", "sky"]}
            ]}
          - {label: "Intro", name: "intro", widget: "object", fields: [
              {label: "Name", name: "name", widget: "string"},
              {label: "Subtitle", name: "subtitle", widget: "string"},
              {label: "Welcome Text", name: "welcomeText", widget: "string"},
              {label: "Description", name: "description", widget: "markdown"},
              {label: "Avatar", name: "avatar", widget: "image"},
              {label: "Socials", name: "socials", widget: "list", fields: [
                  {label: "Platform", name: "platform", widget: "select", options: ["twitter", "instagram", "linkedin", "envelope", "medium", "substack"]},
                  {label: "URL", name: "url", widget: "string"}
              ]}
            ]}
          - {label: "Who Am I", name: "who", widget: "object", fields: [
              {label: "Bio", name: "bio", widget: "list", fields: [{label: "Text", name: "text", widget: "markdown"}]},
              {label: "Shapes Me", name: "shapesMe", widget: "object", fields: [
                  {label: "Title", name: "title", widget: "string"},
                  {label: "Content", name: "content", widget: "list", fields: [{label: "Text", name: "text", widget: "markdown"}]},
                  {label: "Quote", name: "quote", widget: "text"},
                  {label: "Quote Reference", name: "quoteRef", widget: "string"},
                  {label: "Closing", name: "closing", widget: "string", required: false}
              ]}
            ]}
          - {label: "Build", name: "build", widget: "object", fields: [
                {label: "Description", name: "description", widget: "markdown"},
                {label: "Projects", name: "projects", widget: "list", fields: [
                    {label: "Title", name: "title", widget: "string"},
                    {label: "Description", name: "description", widget: "markdown"},
                    {label: "Link Text", name: "linkText", widget: "string"},
                    {label: "Link URL", name: "linkUrl", widget: "string"}
                ]},
                {label: "Footer", name: "footer", widget: "markdown"}
            ]}
          - {label: "Learning", name: "learning", widget: "object", fields: [
                {label: "Description", name: "description", widget: "markdown"},
                {label: "Publications", name: "publications", widget: "list", fields: [
                    {label: "Title", name: "title", widget: "string"},
                    {label: "Category", name: "category", widget: "string"},
                    {label: "Description", name: "description", widget: "markdown"},
                    {label: "Link Text", name: "linkText", widget: "string"},
                    {label: "Link URL", name: "linkUrl", widget: "string"}
                ]},
                {label: "Notes Title", name: "notesTitle", widget: "string"},
                {label: "Notes Description", name: "notesDescription", widget: "markdown"},
                {label: "Notes Links", name: "notesLinks", widget: "list", fields: [
                    {label: "Label", name: "label", widget: "string"},
                    {label: "URL", name: "url", widget: "string"}
                ]}
            ]}
          - {label: "Share", name: "share", widget: "object", fields: [
                {label: "Description", name: "description", widget: "markdown"},
                {label: "Highlights", name: "highlights", widget: "list", fields: [{label: "Text", name: "text", widget: "markdown"}]},
                {label: "Mentorship Title", name: "mentorshipTitle", widget: "string"},
                {label: "Mentorship Content", name: "mentorshipContent", widget: "markdown"},
                {label: "Topics", name: "topics", widget: "list", fields: [{label: "Text", name: "text", widget: "string"}]},
                {label: "Collab Title", name: "collabTitle", widget: "string"},
                {label: "Collab Description", name: "collabDescription", widget: "markdown"},
                {label: "Buttons", name: "buttons", widget: "list", fields: [
                    {label: "Label", name: "label", widget: "string"},
                    {label: "URL", name: "url", widget: "string"},
                    {label: "Primary Style", name: "primary", widget: "boolean"}
                ]}
            ]}
          - {label: "See", name: "see", widget: "object", fields: [
                {label: "Description", name: "description", widget: "markdown"},
                {label: "Images", name: "images", widget: "list", fields: [
                    {label: "Image", name: "image", widget: "image"}
                ]},
                {label: "Links", name: "links", widget: "list", fields: [
                    {label: "Label", name: "label", widget: "string"},
                    {label: "URL", name: "url", widget: "string"}
                ]}
            ]}
          - {label: "Connect", name: "connect", widget: "object", fields: [
                {label: "Title", name: "title", widget: "string"},
                {label: "Description", name: "description", widget: "markdown"},
                {label: "Booking Link", name: "bookingLink", widget: "string", required: false},
                {label: "Links", name: "links", widget: "list", fields: [
                    {label: "Platform", name: "platform", widget: "select", options: ["twitter", "instagram", "linkedin", "envelope", "medium", "substack"]},
                    {label: "URL", name: "url", widget: "string"},
                    {label: "Label", name: "label", widget: "string"},
                    {label: "Sublabel", name: "sublabel", widget: "string"}
                ]}
            ]}

