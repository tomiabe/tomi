
backend:
  name: github
  repo: tomiabe/tomiabe # Update this if your repo name is different
  branch: main
  base_url: "https://tomiabe.vercel.app"
  auth_endpoint: "api/auth"

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "pages"
    label: "Site Content"
    files:
      - name: "personal"
        label: "Personal Site Data"
        file: "content/data.json" 
        fields:
          - {label: "Settings", name: "settings", widget: "object", fields: [
              {label: "Site Title", name: "siteTitle", widget: "string"},
              {label: "Favicon URL", name: "favicon", widget: "image"},
              {label: "Accent Color", name: "accentColor", widget: "color"},
              {label: "Font Family", name: "fontFamily", widget: "select", options: ["sans", "manrope", "serif", "mono"]},
              {label: "Max Width", name: "maxWidth", widget: "select", options: ["max-w-5xl", "max-w-6xl", "max-w-7xl", "max-w-full"]},
              {label: "Dark Mode Theme", name: "darkModeTheme", widget: "select", options: ["black", "grey", "navy", "maroon"]},
              {label: "Light Mode Theme", name: "lightModeTheme", widget: "select", options: ["white", "ash", "ivory", "sky"]}
            ]}
          - {label: "Intro Section", name: "intro", widget: "object", fields: [
              {label: "Sidebar Name", name: "name", widget: "string", default: "Tomi Abe", hint: "Name displayed in the left sidebar"},
              {label: "Sidebar Subtitle", name: "subtitle", widget: "string", hint: "Subtitle displayed in the left sidebar"},
              {label: "Sidebar Avatar", name: "avatar", widget: "image", hint: "Profile picture in the left sidebar"},
              {label: "Main Welcome Text", name: "welcomeText", widget: "string", default: "Welcome to my internet home.", hint: "The typewriter text heading in the main content area"},
              {label: "Main Description", name: "description", widget: "text", hint: "The descriptive paragraph in the main content area"},
              {label: "Sidebar Social Links", name: "socials", widget: "list", fields: [
                 {label: "ID", name: "id", widget: "hidden", default: "uuid"},
                 {label: "Platform", name: "platform", widget: "select", options: ["twitter", "instagram", "linkedin", "envelope", "medium", "substack", "generic"]},
                 {label: "URL", name: "url", widget: "string"}
              ]}
            ]}
          - {label: "Who Section", name: "who", widget: "object", fields: [
              {label: "Bio Paragraphs", name: "bio", widget: "list", fields: [{label: "Text", name: "text", widget: "text"}]},
              {label: "Shapes Me", name: "shapesMe", widget: "object", fields: [
                 {label: "Title", name: "title", widget: "string"},
                 {label: "Content", name: "content", widget: "list", fields: [{label: "Text", name: "text", widget: "text"}]},
                 {label: "Quote", name: "quote", widget: "text"},
                 {label: "Quote Ref", name: "quoteRef", widget: "string"}
              ]}
            ]}
          - {label: "Build Section", name: "build", widget: "object", fields: [
              {label: "Description", name: "description", widget: "text"},
              {label: "Projects", name: "projects", widget: "list", fields: [
                 {label: "ID", name: "id", widget: "hidden", default: "uuid"},
                 {label: "Title", name: "title", widget: "string"},
                 {label: "Description", name: "description", widget: "text"},
                 {label: "Link Text", name: "linkText", widget: "string"},
                 {label: "Link URL", name: "linkUrl", widget: "string"}
              ]},
              {label: "Footer", name: "footer", widget: "string"}
            ]}
          - {label: "Learning Section", name: "learning", widget: "object", fields: [
              {label: "Description", name: "description", widget: "text"},
              {label: "Publications", name: "publications", widget: "list", fields: [
                 {label: "ID", name: "id", widget: "hidden", default: "uuid"},
                 {label: "Title", name: "title", widget: "string"},
                 {label: "Category", name: "category", widget: "string"},
                 {label: "Description", name: "description", widget: "text"},
                 {label: "Link Text", name: "linkText", widget: "string"},
                 {label: "Link URL", name: "linkUrl", widget: "string"}
              ]},
              {label: "Notes Title", name: "notesTitle", widget: "string"},
              {label: "Notes Description", name: "notesDescription", widget: "string"},
              {label: "Notes Links", name: "notesLinks", widget: "list", fields: [
                 {label: "Label", name: "label", widget: "string"},
                 {label: "URL", name: "url", widget: "string"}
              ]}
            ]}
          - {label: "Share Section", name: "share", widget: "object", fields: [
              {label: "Description", name: "description", widget: "text"},
              {label: "Highlights", name: "highlights", widget: "list", fields: [{label: "Text", name: "text", widget: "string"}]},
              {label: "Mentorship Title", name: "mentorshipTitle", widget: "string"},
              {label: "Mentorship Content", name: "mentorshipContent", widget: "text"},
              {label: "Topics", name: "topics", widget: "list", fields: [{label: "Text", name: "text", widget: "string"}]},
              {label: "Collab Title", name: "collabTitle", widget: "string"},
              {label: "Collab Description", name: "collabDescription", widget: "string"},
              {label: "Buttons", name: "buttons", widget: "list", fields: [
                 {label: "Label", name: "label", widget: "string"},
                 {label: "URL", name: "url", widget: "string"},
                 {label: "Is Primary?", name: "primary", widget: "boolean"}
              ]}
            ]}
          - {label: "See Section", name: "see", widget: "object", fields: [
              {label: "Description", name: "description", widget: "text"},
              {label: "Images", name: "images", widget: "list", fields: [
                 {label: "ID", name: "id", widget: "hidden", default: "uuid"},
                 {label: "Thumbnail URL", name: "thumb", widget: "image"},
                 {label: "Full URL", name: "full", widget: "image"}
              ]},
              {label: "Links", name: "links", widget: "list", fields: [
                 {label: "Label", name: "label", widget: "string"},
                 {label: "URL", name: "url", widget: "string"}
              ]}
            ]}
          - {label: "Connect Section", name: "connect", widget: "object", fields: [
              {label: "Title", name: "title", widget: "string"},
              {label: "Description", name: "description", widget: "text"},
              {label: "Booking Link", name: "bookingLink", widget: "string", required: false},
              {label: "Links", name: "links", widget: "list", fields: [
                 {label: "ID", name: "id", widget: "hidden", default: "uuid"},
                 {label: "Platform", name: "platform", widget: "select", options: ["twitter", "instagram", "linkedin", "envelope", "medium", "substack", "generic"]},
                 {label: "URL", name: "url", widget: "string"},
                 {label: "Label", name: "label", widget: "string"},
                 {label: "Sublabel", name: "sublabel", widget: "string"}
              ]}
            ]}

      - name: "studio"
        label: "Studio Site Data"
        file: "content/studio_data.json"
        fields:
          - {label: "Hero", name: "hero", widget: "object", fields: [
              {label: "Headline", name: "headline", widget: "string"},
              {label: "Subheadline", name: "subheadline", widget: "text"},
              {label: "Description", name: "description", widget: "text"},
              {label: "CTA Primary", name: "ctaPrimary", widget: "string"},
              {label: "CTA Secondary", name: "ctaSecondary", widget: "string"}
            ]}
          - {label: "Problem", name: "problem", widget: "object", fields: [
              {label: "Title", name: "title", widget: "string"},
              {label: "Subtitle", name: "subtitle", widget: "text"},
              {label: "Items", name: "items", widget: "list", fields: [
                 {label: "Title", name: "title", widget: "string"},
                 {label: "Description", name: "description", widget: "text"}
              ]}
            ]}
          - {label: "Approach", name: "approach", widget: "object", fields: [
              {label: "Title", name: "title", widget: "string"},
              {label: "Subtitle", name: "subtitle", widget: "string"},
              {label: "Description", name: "description", widget: "text"},
              {label: "Systems", name: "systems", widget: "list", fields: [
                 {label: "Title", name: "title", widget: "string"},
                 {label: "Description", name: "description", widget: "text"}
              ]}
            ]}
          - {label: "Services", name: "services", widget: "object", fields: [
              {label: "Description", name: "description", widget: "text"},
              {label: "Items", name: "items", widget: "list", fields: [
                 {label: "Title", name: "title", widget: "string"},
                 {label: "Description", name: "description", widget: "text"},
                 {label: "Sub Items", name: "subItems", widget: "list", field: {label: "Item", name: "item", widget: "string"}}
              ]}
            ]}
          - {label: "Work Models", name: "workModels", widget: "object", fields: [
              {label: "Items", name: "items", widget: "list", fields: [
                 {label: "Title", name: "title", widget: "string"},
                 {label: "Role", name: "role", widget: "string"},
                 {label: "Description", name: "description", widget: "text"}
              ]}
            ]}
          - {label: "Selected Work", name: "selectedWork", widget: "object", fields: [
              {label: "Tags", name: "tags", widget: "list", field: {label: "Tag", name: "tag", widget: "string"}},
              {label: "Projects", name: "projects", widget: "list", fields: [
                 {label: "ID", name: "id", widget: "hidden", default: "uuid"},
                 {label: "Title", name: "title", widget: "string"},
                 {label: "Category", name: "category", widget: "string"},
                 {label: "Description", name: "description", widget: "text"},
                 {label: "Link Text", name: "linkText", widget: "string"},
                 {label: "Link URL", name: "linkUrl", widget: "string"},
                 {label: "Logo URL", name: "logoUrl", widget: "image"}
              ]}
            ]}
          - {label: "About", name: "about", widget: "object", fields: [
              {label: "Name", name: "name", widget: "string"},
              {label: "Role", name: "role", widget: "string"},
              {label: "Avatar", name: "avatar", widget: "image"},
              {label: "Bio (Short)", name: "bio", widget: "text"},
              {label: "Description (Long)", name: "description", widget: "text"},
              {label: "Mentorship Items", name: "mentorshipItems", widget: "list", field: {label: "Item", name: "item", widget: "string"}}
            ]}
          - {label: "Contact", name: "contact", widget: "object", fields: [
              {label: "Title", name: "title", widget: "string"},
              {label: "Description", name: "description", widget: "text"},
              {label: "Email", name: "email", widget: "string"},
              {label: "Location", name: "location", widget: "string"},
              {label: "Footer Text", name: "footerText", widget: "string"}
            ]}
