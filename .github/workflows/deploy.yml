name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html CNAME robots.txt sitemap.xml favicon.svg favicon.png apple-touch-icon.png _site/
          cp -R assets _site/assets
          for room in me career work studio journal photos; do
            mkdir -p "_site/$room"
            cp "$room/index.html" "_site/$room/"
          done
          mkdir -p _site/journal/a-place-to-begin _site/css _site/js
          cp journal/a-place-to-begin/index.html _site/journal/a-place-to-begin/
          cp css/{home,me,career,work,studio,journal,photos}.css _site/css/
          cp js/{home,work,photos}.js _site/js/
      - name: Publish production site
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean-exclude: pr-preview/
          force: false
